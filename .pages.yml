media:
  input: images/products
  output: /classic-shop/images/products
  categories: [image]
  rename: safe

content:
  - name: catalogo
    label: Catálogo de productos
    type: collection
    path: products
    format: json
    filename:
      template: "{name}.json"
      field: false
    view:
      fields: [image, name, category, price, status, visible, updatedAt]
      primary: name
      search: [name, description, category, status]
      sort: [name, category, price, status, updatedAt]
      default:
        sort: name
        order: asc
    fields:
      - name: image
        label: Fotografía del producto
        type: image
        description: Sube una fotografía clara del producto.
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: name
        label: Nombre
        type: string
        required: true
        description: Nombre corto y fácil de reconocer.
      - name: category
        label: Categoría
        type: select
        required: true
        options:
          placeholder: Selecciona una categoría
          values:
            - name: nino
              label: Ropa Niño
            - name: nina
              label: Ropa Niña
            - name: hombre
              label: Hombre
            - name: mujer
              label: Mujer
            - name: tecnologia
              label: Tecnología
            - name: salud
              label: Salud y cuidado personal
      - name: price
        label: Precio
        type: string
        required: true
        description: Incluye el símbolo de colones, por ejemplo ₡18.500.
      - name: status
        label: Disponibilidad
        type: select
        required: true
        default: Disponible
        options:
          placeholder: Selecciona la disponibilidad
          values:
            - name: Disponible
              label: Disponible
            - name: Agotado
              label: Agotado
      - name: visible
        label: Mostrar en el catálogo público
        type: boolean
        required: true
        default: true
        description: Actívalo para mostrar el producto. Desactívalo para guardarlo sin que aparezca en la tienda.
      - name: sizes
        label: Tallas (solo ropa)
        type: string
        description: Déjalo vacío para Tecnología y Salud. Ejemplo para ropa: S, M, L.
      - name: description
        label: Descripción breve
        type: text
        required: true
        description: Describe brevemente el producto y sus características principales.
        options:
          minlength: 10
          maxlength: 300
      - name: updatedAt
        label: Última actualización
        type: date
        readonly: true
        description: Este registro se actualiza automáticamente cada vez que guardas el producto.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Agregar {name} desde el administrador"
      update: "Actualizar {name} desde el administrador"
      delete: "Eliminar {name} desde el administrador"

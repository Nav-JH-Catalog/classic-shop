name: Actualizar catálogo

on:
  push:
    paths:
      - 'products/**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar catálogo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar archivo público
        run: node scripts/build-products.mjs

      - name: Publicar actualización
        run: |
          if git diff --quiet -- products.json; then
            echo "El catálogo ya está actualizado."
            exit 0
          fi
          git config user.name "Finds Catálogo"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Actualizar catálogo público"
          git push
